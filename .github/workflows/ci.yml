name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  UV_VERSION: "0.5.11"
  # Pinned for the same reason ruff and uv are. `get.nextflow.io` serves the
  # latest release, so an unpinned install silently moved the language level
  # and a top-level `workflow.onComplete` stopped compiling.
  NXF_VER: "26.04.6"
  IMAGE_NAME: ghcr.io/${{ github.repository }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .

  types:
    name: types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run mypy --strict src/

  # Split from `recovery` so the fast signal stays fast. Both are blocking.
  # Each job prints its own partial number; the real one is the `coverage` job
  # below, which combines the two data files. Still ungated by design.
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      # Coverage is measured and printed but not gated: no --cov-fail-under.
      # `optional` is deselected explicitly rather than left to skip on its own
      # conditions: those tests need either an extra or an external dataset, and
      # a job that passes only because everything skipped is not a signal.
      - run: uv run pytest -v -m "not slow and not optional" --cov=src/morphline --cov-report=term-missing
        env:
          COVERAGE_FILE: .coverage.fast

      # `include-hidden-files` is required: upload-artifact v4 skips dotfiles by
      # default, so without it the artifact uploads empty and the coverage job
      # combines nothing while still reporting a number.
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-fast
          path: .coverage.fast
          include-hidden-files: true
          retention-days: 1

  # The statistical recovery suites: model slope recovery and the four §2.3.2
  # harmonization criteria over larger fixture trees. These are the tests that
  # ask whether the methods recover known truth, so they are never optional.
  recovery:
    name: recovery (slow)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest -v -m slow --durations=10
        env:
          COVERAGE_FILE: .coverage.slow

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-slow
          path: .coverage.slow
          include-hidden-files: true
          retention-days: 1

  # The combined number, because neither test job can see the other's data.
  # Measured, the combine barely moves it: the slow suite uniquely covers 2
  # statements (harmonize.py 311 and 442), so 86% either way. That is the
  # honest reading — the recovery tests earn their place by what they assert
  # about recovered truth, not by the lines they touch, which is the same
  # reason this number does not gate.
  coverage:
    name: coverage
    needs: [test, recovery]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen

      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          merge-multiple: true

      # Deliberately no --cov-fail-under: the argument for this suite is the
      # statistical recovery tests, not a percentage, and a floor rewards tests
      # that touch lines over tests that check behaviour.
      - name: Combine and report
        id: cov
        run: |
          set -euo pipefail
          ls -la .coverage.*
          uv run coverage combine .coverage.fast .coverage.slow
          uv run coverage report | tee coverage.txt
          pct=$(uv run coverage json -o - --quiet | uv run python -c \
            'import json,sys; print(round(json.load(sys.stdin)["totals"]["percent_covered"]))')
          echo "pct=$pct" >> "$GITHUB_OUTPUT"
          {
            echo "## Coverage: ${pct}%"
            echo
            echo '```'
            cat coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Fork PRs cannot see secrets, and a badge that silently stops updating is
      # worse than one that is obviously absent — so it publishes only from main.
      - name: Publish the badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: ${{ vars.COVERAGE_GIST_ID }}
          filename: morphline-coverage.json
          label: coverage
          message: ${{ steps.cov.outputs.pct }}%
          valColorRange: ${{ steps.cov.outputs.pct }}
          minColorRange: 50
          maxColorRange: 90

  # Checks the in-repo ComBat against neuroCombat, which is the evidence behind
  # Build.md deviation 1. Its own job because it needs an optional extra that
  # `uv sync` deliberately does not install — neuroCombat is not a dev
  # dependency and must never enter the default resolution.
  xcheck:
    name: combat cross-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --extra combat-xcheck
      # -m optional is deselected everywhere else, so this job is the only
      # place these run. Failing here means our estimator and the reference
      # have diverged, which is a real finding either way.
      - run: uv run --extra combat-xcheck pytest -v -m optional

  e2e:
    name: e2e (python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen

      # The week-2 exit criterion: a cold clone runs the whole pipeline with
      # zero external data present.
      - name: Run pipeline on generated fixtures
        run: uv run morphline run --config config/test.yaml --outdir results/

      # `morphline run` already exits non-zero when the funnel does not
      # reconcile. Re-asserting the artifacts exist catches a silent no-op.
      - name: Assert every artifact was produced
        run: |
          set -euo pipefail
          for f in observations.parquet qc_observations.parquet \
                   harmonized_observations.parquet model_results.parquet \
                   accounting_funnel.parquet provenance.json report.html; do
            test -s "results/$f" || { echo "missing or empty: results/$f"; exit 1; }
          done

      - name: Run the confounded regime (§3.2 regime B)
        run: uv run morphline run --config config/confounded.yaml --outdir results-confounded/

      - uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            results/report.html
            results-confounded/report.html
          retention-days: 14

  nf:
    name: nextflow (docker)
    runs-on: ubuntu-latest
    # Blocking, per Build.md step 10. It ran non-gating for exactly as long as
    # it took to prove: three consecutive runs reported CI green while the
    # image could not build and the pipeline could not compile. A job nobody
    # has to pass is a badge that means nothing.
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # amd64 only for v1.0 (§2.6). arm64 is a timeboxed follow-on.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: morphline:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Nextflow
        run: |
          curl -s https://get.nextflow.io | bash
          sudo mv nextflow /usr/local/bin/

      - name: Run pipeline through Nextflow on fixtures
        run: |
          nextflow run . \
            -profile test,docker \
            --outdir results-nf \
            -process.container morphline:ci \
            -with-report results-nf/pipeline_info/execution_report.html \
            -with-trace  results-nf/pipeline_info/execution_trace.txt \
            -with-dag    results-nf/pipeline_info/dag.html \
            -ansi-log false

      - name: Assert Nextflow produced the report and a reconciling funnel
        run: |
          set -euo pipefail
          test -s results-nf/report.html
          test -s results-nf/accounting_funnel.parquet

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nextflow-run
          path: |
            results-nf/report.html
            results-nf/pipeline_info/
            .nextflow.log
          retention-days: 14

  publish:
    name: publish image
    needs: [lint, types, test, e2e]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tagged by both git SHA and semver, per §2.6.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=long

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
